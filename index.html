<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jour par jour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Jour par jour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne centrée, en-tête, carte d'accent (Aujourd'hui), listes sur cartes blanches, barre de navigation fixe + bouton + flottant. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --ink: #0b0b0c;
  --muted: #606068;
  --faint: #9b9ba3;
  --line: #e9e9ec;
  --accent: #0b0b0c;
  --on-accent: #ffffff;
  --accent-soft: #ececee;
  --ok: #12a150;
  --alert: #d92d20;
  --alert-soft: #fdecea;
  --hero: #0b0b0c;
  --hero-ink: #ffffff;
  --hero-muted: #a4a4ab;
  --hero-track: rgba(255, 255, 255, .16);
  --hero-ring: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 10px 28px rgba(0, 0, 0, .07);
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #161618; --ink: #f4f4f5; --muted: #a1a1a8; --faint: #6c6c73; --line: #26262a;
    --accent: #f4f4f5; --on-accent: #0b0b0c; --accent-soft: #232326; --ok: #4cd18a; --alert: #ff6b61; --alert-soft: #3a1a18;
    --hero: #202024; --hero-ring: #f4f4f5; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #161618; --ink: #f4f4f5; --muted: #a1a1a8; --faint: #6c6c73; --line: #26262a;
  --accent: #f4f4f5; --on-accent: #0b0b0c; --accent-soft: #232326; --ok: #4cd18a; --alert: #ff6b61; --alert-soft: #3a1a18;
  --hero: #202024; --hero-ring: #f4f4f5; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 26px 170px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* En-tête */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.12; letter-spacing: -.02em; margin: 4px 0 0; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
.roundbtn { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--muted); }
.roundbtn:hover { color: var(--ink); }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.navgrp { display: flex; gap: 8px; }
.pill { background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--ink); }
.pill.soft { background: var(--accent-soft); color: var(--accent); box-shadow: none; }

/* Carte d'accent */
.hero { margin-top: 20px; background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow); }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .tr { stroke: var(--hero-track); }
.ring .fg { stroke: var(--hero-ring); transition: stroke-dashoffset .5s ease; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hero-t { min-width: 0; }
.hero-t strong { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.hero-t span { display: block; margin-top: 4px; color: var(--hero-muted); font-size: 14px; }

/* Sections et tâches */
section { margin-top: 26px; }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 10px; padding-inline: 4px; }
.sec.alert { color: var(--alert); }
.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); list-style: none; margin: 0; padding: 0; overflow: hidden; }
.task { display: flex; gap: 14px; align-items: flex-start; padding: 15px 16px; transition: opacity .25s ease, transform .25s ease; }
.task + .task { border-top: 1px solid var(--line); }
.task.leaving { opacity: 0; transform: translateX(28px); }
.check { flex: none; width: 26px; height: 26px; margin-top: 0; border: 2px solid var(--faint); border-radius: 50%; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check svg { width: 15px; height: 15px; stroke: var(--on-accent); fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .15s; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { opacity: 1; transform: scale(1); }
.body { flex: 1; min-width: 0; }
.t { display: block; width: 100%; overflow-wrap: anywhere; font-weight: 500; font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 5px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tm { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 99px; padding: 1px 9px; }
.late { background: var(--alert-soft); color: var(--alert); font-weight: 600; border-radius: 99px; padding: 1px 9px; }
.tag { border: 1px dashed var(--faint); border-radius: 99px; padding: 0 8px; font-size: 11.5px; color: var(--faint); }
.planbtn { font-size: 13px; font-weight: 600; color: var(--accent); padding: 2px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { background: var(--bg); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.chip:hover, .chip.active { background: var(--accent); color: var(--on-accent); }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.linkbtn { display: block; margin: 20px auto 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-align: center; }
.linkbtn.danger { color: var(--alert); }

/* Semaine */
.strip { margin-top: 18px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dayb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 8px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: center; min-width: 0; }
.dayb .wd { font-size: 11.5px; font-weight: 600; color: var(--faint); }
.dayb .dn { font-family: var(--font-display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dayb .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.dayb.has .dot { background: var(--accent); }
.dayb.today .dn { color: var(--accent); }
.dayb.sel { background: var(--accent); color: var(--on-accent); }
.dayb.sel .wd { color: var(--on-accent); opacity: .8; }
.dayb.sel .dn { color: var(--on-accent); }
.dayb.sel.has .dot { background: var(--on-accent); }

.dayb.has.urgent .dot { background: var(--alert); }

/* Rouge = information : tâche importante ou non faite */
.imp { background: var(--alert-soft); color: var(--alert); font-weight: 600; border-radius: 99px; padding: 1px 9px; }
.check.imp, .check.imp:hover { border-color: var(--alert); }
.check.imp.on { background: var(--alert); border-color: var(--alert); }
.impchip { background: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; }
.impchip:hover { background: var(--alert-soft); color: var(--alert); }
.impchip[aria-pressed="true"] { background: var(--alert); color: #fff; }

/* Navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.navb { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; font-weight: 600; color: var(--faint); text-align: center; border-radius: 12px; }
.navb[aria-current="page"] { color: var(--accent); }
.fabrow { position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 25; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fabin { max-width: 560px; margin: 0 auto; display: flex; justify-content: flex-end; }
.fab { pointer-events: auto; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0, 0, 0, .28); }
.fab svg.i { width: 26px; height: 26px; stroke-width: 2.4; }

/* Fiche d'ajout / modification */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 30, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 26px 26px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; max-height: 94%; overflow-y: auto; }
.ftitle { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 8px 0 12px; font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.ftitle::placeholder { color: var(--faint); }
.ftitle:focus { outline: none; border-bottom-color: var(--accent); }
.flbl { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: block; }
.when { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.when .chip { background: var(--bg); padding: 8px 14px; font-weight: 600; }
.sheet input[type="date"], .sheet input[type="time"], .sheet select { background: var(--bg); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; width: 100%; font-size: 15px; }
.sheet input:focus, .sheet select:focus { outline: none; border-color: var(--accent); }
.when input[type="date"] { width: auto; flex: 1; min-width: 150px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; flex-direction: column; gap: 6px; }
.btn { width: 100%; padding: 14px 18px; border-radius: 14px; font-weight: 600; text-align: center; font-size: 15.5px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { color: var(--muted); }
.btn.danger { color: var(--alert); }
.btn.danger.ask { background: var(--alert); color: #fff; }

/* Corbeille */
.trow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow .tt { flex: 1; min-width: 0; }
.trow .tt b { display: block; font-weight: 500; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); overflow-wrap: anywhere; }
.trow .tt span { display: block; font-size: 12.5px; color: var(--faint); margin-top: 2px; }

.toast { position: fixed; left: 50%; transform: translate(-50%, 8px); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 500; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 700; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.toast button[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <main id="main"></main>
</div>

<div class="fabrow"><div class="fabin">
  <button class="fab" type="button" data-act="openadd" aria-label="Ajouter une tâche"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div></div>

<nav class="nav" aria-label="Vues"><div class="nav-in">
  <button class="navb" type="button" data-act="view" data-view="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Aujourd’hui</button>
  <button class="navb" type="button" data-act="view" data-view="week"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Semaine</button>
  <button class="navb" type="button" data-act="view" data-view="inbox"><svg class="i" viewBox="0 0 24 24"><path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5a3.5 3.5 0 0 0 7 0H20"/></svg>Sans date</button>
</div></nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastUndo" data-act="undo" hidden>Annuler</button></div>

<script>
(function () {
  var KEY = "jourparjour.v1", KEEP_DAYS = 15, DAY_MS = 864e5;
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var key = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var parse = function (k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var addDays = function (k, n) { var d = parse(k); d.setDate(d.getDate() + n); return key(d); };
  var diffDays = function (a, b) { return Math.round((parse(a) - parse(b)) / DAY_MS); };
  var mondayOf = function (k) { return addDays(k, -((parse(k).getDay() + 6) % 7)); };
  var fmt = function (k, o) { return new Intl.DateTimeFormat("fr-FR", o).format(parse(k)); };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var uid = function () { return Math.random().toString(36).slice(2, 10); };
  var $ = function (id) { return document.getElementById(id); };
  var REP = { none: "", daily: "Tous les jours", weekly: "Chaque semaine", monthly: "Chaque mois" };
  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var TRASH = '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></svg>';

  var todayKey = key(new Date());

  /* Stockage */
  function load() {
    try { var r = localStorage.getItem(KEY); if (r) { var d = JSON.parse(r); if (d && Array.isArray(d.tasks)) return d; } } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ tasks: tasks, trash: trash, stats: stats })); } catch (e) {} }
  function mk(o) {
    return Object.assign({ id: uid(), title: "", date: null, time: null, repeat: "none", done: false, doneAt: null, doneDates: [], created: Date.now(), example: false, important: false }, o);
  }
  function purge() {
    var before = trash.length, now = Date.now();
    trash = trash.filter(function (e) { return now - e.trashedAt < KEEP_DAYS * DAY_MS; });
    return trash.length !== before;
  }

  var tasks, trash, stats;
  var data = load();
  if (data) {
    tasks = data.tasks; trash = Array.isArray(data.trash) ? data.trash : []; stats = data.stats || {};
    // Les anciennes tâches déjà cochées partent dans la corbeille.
    var keep = [];
    tasks.forEach(function (t) {
      if (!Array.isArray(t.doneDates)) t.doneDates = [];
      if (t.repeat === "none" && t.done) {
        var snap = JSON.parse(JSON.stringify(t)); snap.done = false; snap.doneAt = null;
        trash.unshift({ eid: uid(), trashedAt: Date.now(), completedOn: t.doneAt || todayKey, day: t.date || null, kind: "once", srcId: t.id, task: snap });
        if (t.date) stats[t.date] = (stats[t.date] || 0) + 1;
      } else keep.push(t);
    });
    tasks = keep; purge(); save();
  } else {
    trash = []; stats = {};
    tasks = [
      mk({ title: "Faire les courses", date: todayKey, time: "18:00", example: true }),
      mk({ title: "Lire 20 pages", date: todayKey, repeat: "daily", example: true }),
      mk({ title: "Rendre le formulaire", date: addDays(todayKey, -1), example: true }),
      mk({ title: "Préparer la réunion de lundi", example: true })
    ];
    save();
  }

  /* État */
  var view = "today", prevView = "today", weekStart = mondayOf(todayKey), selDay = todayKey;
  var sheet = null, planId = null, clearAsk = false, busy = false, toastTimer = null, lastEid = null;

  /* Règles */
  function occursOn(t, k) {
    if (!t.date) return false;
    if (t.repeat === "none") return t.date === k;
    if (k < t.date) return false;
    if (t.repeat === "daily") return true;
    if (t.repeat === "weekly") return diffDays(k, t.date) % 7 === 0;
    if (t.repeat === "monthly") return parse(k).getDate() === parse(t.date).getDate();
    return false;
  }
  function byTime(a, b) {
    if (!!a.important !== !!b.important) return a.important ? -1 : 1;
    if (a.time && b.time) return a.time < b.time ? -1 : a.time > b.time ? 1 : a.created - b.created;
    if (a.time) return -1; if (b.time) return 1;
    return a.created - b.created;
  }
  function openOn(k) {
    return tasks.filter(function (t) { return occursOn(t, k) && (t.repeat === "none" || t.doneDates.indexOf(k) === -1); }).sort(byTime);
  }
  function carried() {
    return tasks.filter(function (t) { return t.repeat === "none" && t.date && t.date < todayKey; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b); });
  }
  function inbox() { return tasks.filter(function (t) { return !t.date; }).sort(byTime); }
  function doneToday() { return trash.filter(function (e) { return e.completedOn === todayKey && (!e.day || e.day <= todayKey); }).length; }
  function streak() {
    var n = 0;
    if (openOn(todayKey).length + carried().length === 0 && trash.some(function (e) { return e.completedOn === todayKey; })) n++;
    var keys = Object.keys(stats).concat(tasks.filter(function (t) { return t.date; }).map(function (t) { return t.date; })).sort();
    if (!keys.length) return n;
    var min = keys[0], k = addDays(todayKey, -1), g = 0;
    while (k >= min && g++ < 400) {
      if (openOn(k).length > 0) break;
      if (stats[k] > 0) n++;
      k = addDays(k, -1);
    }
    return n;
  }
  function relDay(k) { var d = diffDays(todayKey, k); return d === 1 ? "hier" : "il y a " + d + " jours"; }
  function daysLeft(e) { return Math.max(1, Math.ceil((e.trashedAt + KEEP_DAYS * DAY_MS - Date.now()) / DAY_MS)); }
  function find(id) { return tasks.filter(function (t) { return t.id === id; })[0]; }

  function complete(id, day) {
    var t = find(id); if (!t) return;
    var once = t.repeat === "none", d = once ? t.date : day;
    var snap = JSON.parse(JSON.stringify(t));
    var entry = { eid: uid(), trashedAt: Date.now(), completedOn: todayKey, day: d || null, kind: once ? "once" : "rep", srcId: t.id, task: snap };
    if (once) tasks = tasks.filter(function (x) { return x.id !== id; });
    else if (t.doneDates.indexOf(day) === -1) t.doneDates.push(day);
    if (d) stats[d] = (stats[d] || 0) + 1;
    trash.unshift(entry); lastEid = entry.eid; save();
    toast("Tâche terminée", true);
  }
  function restore(eid) {
    var e = trash.filter(function (x) { return x.eid === eid; })[0]; if (!e) return;
    if (e.kind === "rep" && find(e.srcId)) {
      var src = find(e.srcId), i = src.doneDates.indexOf(e.day); if (i !== -1) src.doneDates.splice(i, 1);
    } else {
      var snap = e.task; snap.done = false; snap.doneAt = null;
      if (e.kind === "rep") { snap.repeat = "none"; snap.date = e.day; snap.doneDates = []; }
      tasks.push(snap);
    }
    if (e.day && stats[e.day]) stats[e.day] = Math.max(0, stats[e.day] - 1);
    trash = trash.filter(function (x) { return x.eid !== eid; });
    save(); toast("Tâche restaurée", false); render();
  }

  /* Rendu */
  function topbar(eyebrow, title, sub) {
    return '<div class="top"><div><div class="eyebrow">' + esc(eyebrow) + "</div><h1>" + esc(title) + "</h1>" + (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" +
      '<button class="roundbtn" type="button" data-act="trash" aria-label="Corbeille, ' + trash.length + ' tâche' + (trash.length > 1 ? "s" : "") + '">' + TRASH + (trash.length ? '<span class="badge">' + trash.length + "</span>" : "") + "</button></div>";
  }
  function row(t, k, o) {
    o = o || {};
    var meta = [], red = t.important || (t.repeat === "none" && t.date && t.date < todayKey);
    if (t.important) meta.push('<span class="imp">Importante</span>');
    if (t.repeat === "none" && t.date && t.date < todayKey) meta.push('<span class="late">Prévue ' + relDay(t.date) + "</span>");
    if (t.time) meta.push('<span class="tm">' + esc(t.time) + "</span>");
    if (t.repeat !== "none") meta.push("<span>" + REP[t.repeat] + "</span>");
    if (t.example) meta.push('<span class="tag">exemple</span>');
    if (o.plan) meta.push('<button class="planbtn" type="button" data-act="planopen" data-id="' + t.id + '">' + (planId === t.id ? "Fermer" : "Choisir un jour") + "</button>");
    var chips = "";
    if (o.plan && planId === t.id) {
      chips = '<div class="chips" role="group" aria-label="Planifier la tâche">';
      for (var i = 0; i < 7; i++) {
        var dk = addDays(todayKey, i);
        chips += '<button class="chip" type="button" data-act="plan" data-id="' + t.id + '" data-day="' + dk + '">' + esc(i === 0 ? "Aujourd’hui" : i === 1 ? "Demain" : cap(fmt(dk, { weekday: "short", day: "numeric" }))) + "</button>";
      }
      chips += "</div>";
    }
    return '<li class="task" data-id="' + t.id + '"><button class="check' + (red ? " imp" : "") + '" type="button" data-act="toggle" data-id="' + t.id + '" data-day="' + (k || "") + '" aria-label="Terminer : ' + esc(t.title) + '">' + CHECK + "</button>" +
      '<div class="body"><button class="t" type="button" data-act="edit" data-id="' + t.id + '">' + esc(t.title) + "</button>" +
      (meta.length ? '<div class="meta">' + meta.join("") + "</div>" : "") + chips + "</div></li>";
  }
  function list(rows) { return '<ul class="card">' + rows.join("") + "</ul>"; }

  function renderToday() {
    var c = carried(), today = openOn(todayKey), open = c.length + today.length, done = doneToday(), total = open + done;
    var pct = total ? Math.round(done / total * 100) : 0, s = streak(), CIRC = 2 * Math.PI * 36;
    var title = total === 0 ? "Journée libre" : open === 0 ? "Tout est fait" : done + " sur " + total + " faites";
    var line = s > 0 ? "Série de " + s + (s > 1 ? " jours" : " jour") : (open ? open + (open > 1 ? " tâches restantes" : " tâche restante") : "Ajoute une tâche avec le bouton +");
    $("head").innerHTML = topbar("Aujourd’hui", cap(fmt(todayKey, { weekday: "long", day: "numeric", month: "long" }))) +
      '<div class="hero"><div class="ring"><svg viewBox="0 0 88 88" aria-hidden="true"><circle class="tr" cx="44" cy="44" r="36"/><circle class="fg" cx="44" cy="44" r="36" stroke-dasharray="' + CIRC.toFixed(2) + '" stroke-dashoffset="' + (CIRC * (1 - pct / 100)).toFixed(2) + '"/></svg><b>' + pct + '%</b></div>' +
      '<div class="hero-t"><strong>' + title + "</strong><span>" + line + "</span></div></div>";
    var html = "";
    if (c.length) html += '<section><div class="sec alert"><span>Reportées</span><span>' + c.length + "</span></div>" + list(c.map(function (t) { return row(t, t.date); })) + "</section>";
    html += '<section><div class="sec"><span>Aujourd’hui</span><span>' + today.length + "</span></div>" +
      (today.length ? list(today.map(function (t) { return row(t, todayKey); })) :
        '<div class="card"><div class="empty"><b>' + (done ? "Bien joué" : "Rien de prévu") + "</b>" + (done ? "Tout ce qui était prévu aujourd’hui est terminé." : "Appuie sur + pour ajouter une tâche.") + "</div></div>") + "</section>";
    if (tasks.some(function (t) { return t.example; })) html += '<button class="linkbtn" type="button" data-act="clearex">Effacer les tâches d’exemple</button>';
    $("main").innerHTML = html;
  }

  function renderWeek() {
    var mid = addDays(weekStart, 3);
    $("head").innerHTML = topbar("Semaine", cap(fmt(mid, { month: "long", year: "numeric" })));
    var html = '<div class="navgrp" style="margin-top:16px"><button class="pill" type="button" data-act="prevwk">← Précédente</button><button class="pill" type="button" data-act="nextwk">Suivante →</button>' +
      (selDay !== todayKey ? '<button class="pill soft" type="button" data-act="thiswk">Aujourd’hui</button>' : "") + "</div>";
    html += '<div class="strip">';
    for (var i = 0; i < 7; i++) {
      var k = addDays(weekStart, i), ol = openOn(k), has = ol.length > 0, urg = ol.some(function (t) { return t.important || (t.repeat === "none" && t.date < todayKey); });
      html += '<button class="dayb' + (k === selDay ? " sel" : "") + (k === todayKey ? " today" : "") + (has ? " has" : "") + (urg ? " urgent" : "") + '" type="button" data-act="selday" data-day="' + k + '" aria-label="' + fmt(k, { weekday: "long", day: "numeric", month: "long" }) + '" aria-pressed="' + (k === selDay) + '">' +
        '<span class="wd">' + fmt(k, { weekday: "narrow" }).toUpperCase() + '</span><span class="dn">' + parse(k).getDate() + '</span><span class="dot"></span></button>';
    }
    html += "</div>";
    var l = openOn(selDay);
    html += '<section><div class="sec"><span>' + cap(fmt(selDay, { weekday: "long", day: "numeric", month: "long" })) + "</span><span>" + l.length + "</span></div>" +
      (l.length ? list(l.map(function (t) { return row(t, selDay); })) : '<div class="card"><div class="empty"><b>Journée libre</b>Appuie sur + pour planifier quelque chose ce jour-là.</div></div>') + "</section>";
    $("main").innerHTML = html;
  }

  function renderInbox() {
    var l = inbox();
    $("head").innerHTML = topbar("À planifier", "Sans date", l.length ? l.length + (l.length > 1 ? " tâches attendent un jour." : " tâche attend un jour.") : "Rien en attente.");
    $("main").innerHTML = "<section>" + (l.length ? list(l.map(function (t) { return row(t, null, { plan: true }); })) :
      '<div class="card"><div class="empty"><b>Aucune idée en attente</b>Les tâches sans date arrivent ici. Tu choisis ensuite un jour en un geste.</div></div>') + "</section>";
  }

  function renderTrash() {
    $("head").innerHTML = '<div class="top"><div><div class="eyebrow">Tâches terminées</div><h1>Corbeille</h1><div class="sub">Les tâches cochées arrivent ici et sont effacées définitivement après ' + KEEP_DAYS + " jours.</div></div>" +
      '<button class="pill" type="button" data-act="back">Retour</button></div>';
    var html = "<section>";
    if (!trash.length) html += '<div class="card"><div class="empty"><b>La corbeille est vide</b>Dès que tu coches une tâche, elle vient ici.</div></div>';
    else {
      html += '<ul class="card">' + trash.map(function (e) {
        var d = daysLeft(e);
        return '<li class="trow"><div class="tt"><b>' + esc(e.task.title) + "</b><span>Terminée " + (e.completedOn === todayKey ? "aujourd’hui" : "le " + fmt(e.completedOn, { day: "numeric", month: "short" })) +
          " · effacée dans " + d + (d > 1 ? " jours" : " jour") + '</span></div><button class="pill soft" type="button" data-act="restore" data-eid="' + e.eid + '">Restaurer</button></li>';
      }).join("") + "</ul>";
      html += '<button class="linkbtn danger" type="button" data-act="emptytrash">' + (clearAsk ? "Confirmer : tout effacer maintenant" : "Vider la corbeille") + "</button>";
    }
    $("main").innerHTML = html + "</section>";
  }

  function renderNav() {
    Array.prototype.forEach.call(document.querySelectorAll(".navb"), function (b) {
      if (b.getAttribute("data-view") === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  }

  function defaultDate() { return view === "today" ? todayKey : view === "week" ? selDay : null; }

  function renderSheet() {
    var root = $("sheetRoot");
    if (!sheet) { root.innerHTML = ""; return; }
    var f = sheet.form, edit = sheet.mode === "edit";
    root.innerHTML = '<div class="overlay" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + (edit ? "Modifier la tâche" : "Nouvelle tâche") + '">' +
      '<input class="ftitle" id="fTitle" type="text" maxlength="200" autocomplete="off" placeholder="Que faut-il faire ?" aria-label="Tâche" value="' + esc(f.title) + '">' +
      '<div><span class="flbl">Quand</span><div class="when" id="fWhen">' +
      '<button class="chip" type="button" data-act="when" data-when="today">Aujourd’hui</button>' +
      '<button class="chip" type="button" data-act="when" data-when="tomorrow">Demain</button>' +
      '<button class="chip" type="button" data-act="when" data-when="none">Sans date</button>' +
      '<input type="date" id="fDate" aria-label="Choisir une date" value="' + (f.date || "") + '"></div></div>' +
      '<div class="two"><label><span class="flbl">Heure (facultatif)</span><input type="time" id="fTime" value="' + (f.time || "") + '"></label>' +
      '<label><span class="flbl">Répéter</span><select id="fRep">' +
      [["none", "Jamais"], ["daily", "Tous les jours"], ["weekly", "Toutes les semaines"], ["monthly", "Tous les mois"]].map(function (r) { return '<option value="' + r[0] + '"' + (f.repeat === r[0] ? " selected" : "") + ">" + r[1] + "</option>"; }).join("") +
      "</select></label></div>" +
      '<div><span class="flbl">Priorité</span><button class="impchip" type="button" id="fImp" data-act="toggleimp" aria-pressed="' + (!!f.important) + '">Importante</button></div>' +
      '<div class="actions"><button class="btn primary" type="button" data-act="submit">' + (edit ? "Enregistrer" : "Ajouter la tâche") + "</button>" +
      (edit ? '<button class="btn danger' + (sheet.delAsk ? " ask" : "") + '" type="button" data-act="' + (sheet.delAsk ? "delok" : "delask") + '">' + (sheet.delAsk ? "Confirmer la suppression" : "Supprimer sans corbeille") + "</button>" : "") +
      '<button class="btn ghost" type="button" data-act="closesheet">Annuler</button></div></div></div>';
    syncChips();
  }
  function syncChips() {
    var el = $("fDate"); if (!el) return;
    var v = el.value, map = { today: todayKey, tomorrow: addDays(todayKey, 1), none: "" };
    Array.prototype.forEach.call(document.querySelectorAll("#fWhen .chip"), function (b) { b.classList.toggle("active", map[b.getAttribute("data-when")] === v); });
  }

  function render() {
    if (view === "today") renderToday(); else if (view === "week") renderWeek(); else if (view === "inbox") renderInbox(); else renderTrash();
    renderNav();
  }

  function toast(msg, undo) {
    $("toastMsg").textContent = msg; $("toastUndo").hidden = !undo;
    var el = $("toast"); el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, undo ? 5000 : 2200);
  }

  function openSheet(mode, t) {
    sheet = mode === "edit"
      ? { mode: "edit", id: t.id, delAsk: false, form: { title: t.title, date: t.date || "", time: t.time || "", repeat: t.repeat, important: !!t.important } }
      : { mode: "add", delAsk: false, form: { title: "", date: defaultDate() || "", time: "", repeat: "none", important: false } };
    renderSheet();
    var f = $("fTitle"); if (f) setTimeout(function () { f.focus(); }, 30);
  }
  function submitSheet() {
    var title = $("fTitle").value.trim();
    if (!title) { $("fTitle").focus(); return; }
    var date = $("fDate").value || null, time = $("fTime").value || null, repeat = $("fRep").value, important = $("fImp").getAttribute("aria-pressed") === "true";
    if (repeat !== "none" && !date) date = todayKey;
    if (sheet.mode === "edit") {
      var t = find(sheet.id);
      if (t) { t.title = title; t.date = date; t.time = time; t.repeat = repeat; t.important = important; t.example = false; }
      toast("Modifications enregistrées", false);
    } else {
      tasks.push(mk({ title: title, date: date, time: time, repeat: repeat, important: important }));
      toast(!date ? "Ajoutée dans Sans date" : date === todayKey ? "Ajoutée pour aujourd’hui" : "Ajoutée pour " + fmt(date, { weekday: "long", day: "numeric", month: "long" }), false);
    }
    save(); sheet = null; renderSheet(); render();
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), day = el.getAttribute("data-day");
    if (act === "closesheet") { if (el.classList.contains("overlay") && e.target !== el) return; sheet = null; renderSheet(); return; }
    if (act === "toggle") {
      if (busy) return;
      var li = el.closest(".task"); busy = true; el.classList.add("on"); if (li) li.classList.add("leaving");
      setTimeout(function () { complete(id, day || null); busy = false; render(); }, 280);
      return;
    }
    if (act === "edit") { var t = find(id); if (t) openSheet("edit", t); return; }
    if (act === "openadd") { openSheet("add"); return; }
    if (act === "when") { var w = el.getAttribute("data-when"); $("fDate").value = w === "today" ? todayKey : w === "tomorrow" ? addDays(todayKey, 1) : ""; syncChips(); return; }
    if (act === "toggleimp") { el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") === "true" ? "false" : "true"); return; }
    if (act === "submit") { submitSheet(); return; }
    if (act === "delask") { sheet.form = { title: $("fTitle").value, date: $("fDate").value, time: $("fTime").value, repeat: $("fRep").value, important: $("fImp").getAttribute("aria-pressed") === "true" }; sheet.delAsk = true; renderSheet(); return; }
    if (act === "delok") { tasks = tasks.filter(function (x) { return x.id !== sheet.id; }); save(); sheet = null; renderSheet(); render(); toast("Tâche supprimée", false); return; }
    if (act === "planopen") { planId = planId === id ? null : id; render(); return; }
    if (act === "plan") { var p = find(id); if (p) { p.date = day; planId = null; save(); toast("Planifiée : " + fmt(day, { weekday: "long", day: "numeric", month: "long" }), false); render(); } return; }
    if (act === "selday") { selDay = day; render(); return; }
    if (act === "view") { view = el.getAttribute("data-view"); planId = null; clearAsk = false; render(); window.scrollTo(0, 0); return; }
    if (act === "trash") { prevView = view; view = "trash"; clearAsk = false; render(); window.scrollTo(0, 0); return; }
    if (act === "back") { view = prevView; clearAsk = false; render(); window.scrollTo(0, 0); return; }
    if (act === "prevwk") { weekStart = addDays(weekStart, -7); selDay = addDays(selDay, -7); render(); return; }
    if (act === "nextwk") { weekStart = addDays(weekStart, 7); selDay = addDays(selDay, 7); render(); return; }
    if (act === "thiswk") { weekStart = mondayOf(todayKey); selDay = todayKey; render(); return; }
    if (act === "undo") { if (lastEid) restore(lastEid); lastEid = null; $("toast").classList.remove("show"); return; }
    if (act === "restore") { restore(el.getAttribute("data-eid")); return; }
    if (act === "emptytrash") { if (!clearAsk) { clearAsk = true; render(); } else { trash = []; clearAsk = false; save(); render(); toast("Corbeille vidée", false); } return; }
    if (act === "clearex") { tasks = tasks.filter(function (x) { return !x.example; }); save(); render(); toast("Exemples effacés", false); return; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "fDate") syncChips(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "fTitle") { e.preventDefault(); submitSheet(); }
    if (e.key === "Escape" && sheet) { sheet = null; renderSheet(); }
  });

  function tick() {
    var changed = purge(), k = key(new Date());
    if (k !== todayKey) { var cur = weekStart === mondayOf(todayKey); todayKey = k; if (cur) { weekStart = mondayOf(k); selDay = k; } changed = true; }
    if (changed) { save(); if (!sheet) render(); }
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
  setInterval(tick, 60000);

  render();
})();
</script>

<script>
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
